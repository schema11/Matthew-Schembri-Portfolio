<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to my portfolio. Explore my robot arm calculator projects.">
  <title>Home | My Portfolio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --panel-hover: #1c2330;
      --line: #30363d;
      --text: #e6edf3;
      --muted: #9aa7b4;
      --accent: #58a6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(ellipse at 50% 0, #1f6feb24, transparent 55%),
        var(--bg);
      color: var(--text);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(2rem, 7vw, 4.5rem);
      text-align: center;
      background: linear-gradient(145deg, #1c2330, var(--panel) 55%);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 80px #0006;
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 8vw, 4rem);
      letter-spacing: -.045em;
      line-height: 1.08;
    }

    .intro {
      max-width: 440px;
      margin: 1.25rem auto 2rem;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .links {
      display: grid;
      gap: .85rem;
    }

    .button {
      display: block;
      padding: .9rem 1.2rem;
      border: 1px solid #1f6feb88;
      border-radius: 9px;
      background: #1f6feb24;
      color: var(--text);
      font-weight: 650;
      text-decoration: none;
      transition: background-color .15s ease, border-color .15s ease, transform .15s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: #1f6feb40;
    }

    .button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Portfolio</p>
    <h1>Welcome to my portfolio</h1>
    <p class="intro">Explore my robot arm calculator projects.</p>
    <nav class="links" aria-label="Portfolio projects">
      <a class="button" href="Tools/">Tools</a>
    </nav>
  </main>
</body>
</html>
